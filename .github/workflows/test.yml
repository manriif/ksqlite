name: Run tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_windows:
        description: 'Run test-windows'
        required: false
        type: boolean
        default: true
      test_linux:
        description: 'Run test-linux'
        required: false
        type: boolean
        default: true
      test_macos:
        description: 'Run test-macos'
        required: false
        type: boolean
        default: true
      test_web:
        description: 'Run test-web'
        required: false
        type: boolean
        default: true
  workflow_call:

permissions:
  contents: read

jobs:
  test-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.test_windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Run Windows native and JVM tests
        shell: bash
        run: |
          ./gradlew \
            jvmTest \
            mingwX64Test \
            -Pksqlite.build.wasm.enabled=false \
            -Pksqlite.build.platforms=mingwX64

  test-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.test_linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Linux native, JVM, and Android device tests
        run: |
          ./gradlew \
            jvmTest \
            linuxX64Test \
            pixel2api30AndroidDeviceTest \
            -Pksqlite.build.wasm.enabled=false \
            -Pksqlite.build.platforms=linuxX64

  test-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.test_macos
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Run Apple and JVM tests
        run: |
          ./gradlew \
            jvmTest \
            macosArm64Test \
            iosSimulatorArm64Test \
            tvosSimulatorArm64Test \
            watchosSimulatorArm64Test \
            -Pksqlite.build.wasm.enabled=false \
            -Pksqlite.build.platforms=macosArm64,iosSimulatorArm64,tvosSimulatorArm64,watchosSimulatorArm64

  test-web:
    if: github.event_name != 'workflow_dispatch' || inputs.test_web
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: true
      - name: Run JS and WasmJs browser tests
        run: |
          ./gradlew \
            jsBrowserTest \
            wasmJsBrowserTest \
            --no-parallel \
            -Pksqlite.build.wasm.enabled=true \
            -Pksqlite.build.platforms=