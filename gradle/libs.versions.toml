# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]

# Project version, matching the targeted sqlite version
ksqlite = "3.51.2"

# Android
android-ndk = "29.0.14206865"
android-sdk-compile = "36"
android-sdk-min = "21"

# Cmake
cmake = "3.28.3"

# Jvm target version
jvm-target = "17"

# SQLite Multiple Ciphers version postfixed with SHA-256 checksum.
# Release here: https://github.com/utelle/SQLite3MultipleCiphers/releases
sqliteMultipleCiphers = "2.2.7.8e84aadc53bc09bda9cd307745a178191e7783e1b6478d74ffbcdf6a04f98085"

android-gradlePlugin = "9.0.0"
dokka = "2.1.0"
undercouch-download = "5.6.0"
gradle-pluginPublish = "2.0.0"
kotlin = "2.3.20-Beta1"
kotlin-wrappers = "2026.1.13"
kotlinx-coroutines = "1.10.2"
vanniktech-mavenPublish = "0.36.0"
turbine = "1.2.1"
z4kn4fein-semver = "3.0.0"

[plugins]

conventions-common = { id = "conventions-common", version.ref = "ksqlite" }
conventions-kmp = { id = "conventions-kmp", version.ref = "ksqlite" }
sqliteCompiler = { id = "sqlite-compiler", version.ref = "ksqlite" }

android-library = { id = "com.android.library", version.ref = "android-gradlePlugin" }
android-multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradlePlugin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
gradle-pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "gradle-pluginPublish" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-mavenPublish" }

[libraries]

android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "android-gradlePlugin" }
cashapp-turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
dokka-gradlePlugin = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "dokka" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers" }
kotlin-js = { module = "org.jetbrains.kotlin-wrappers:kotlin-js", version.ref = "kotlin-wrappers" }
kotlinx-coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
undercouch-dowload = { module = "de.undercouch.download:de.undercouch.download.gradle.plugin", version.ref = "undercouch-download" }
vanniktech-mavenPublish = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-mavenPublish" }
z4kn4fein-semver = { module = "io.github.z4kn4fein:semver", version.ref = "z4kn4fein-semver" }